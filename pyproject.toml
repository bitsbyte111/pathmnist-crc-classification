[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crc-tissuenet"
version = "0.1.0"
description = "Benchmarking CNNs, vision transformers and MLP models for colorectal cancer tissue classification (PathMNIST)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Israr Hussain"}, {name = "Sumreen Fatima"}]
keywords = ["computational pathology", "deep learning", "PathMNIST", "MedMNIST", "SHAP", "colorectal cancer"]
dependencies = [
  "torch>=2.1", "torchvision>=0.16", "timm>=1.0", "numpy>=1.24", "scipy>=1.10",
  "scikit-learn>=1.3", "pandas>=2.0", "matplotlib>=3.7", "pyyaml>=6.0", "shap>=0.44", "tabulate>=0.9",
]

[project.optional-dependencies]
tune = ["optuna>=3.4"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
