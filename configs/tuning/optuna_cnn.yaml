# Joint Optuna search around the ablation winner (probes interactions the greedy search can miss).
base: ../models/b1_cnn_tuned.yaml
n_trials: 20
direction: maximize            # validation macro F1
overrides:                     # fixed for every trial
  train.epochs: 20
  train.early_stopping_patience: 5
  train.save_checkpoint: none
  eval.test: false
  eval.save_predictions: false
search_space:                  # type: loguniform | uniform | int | categorical
  train.lr:              {type: loguniform, low: 1.0e-4, high: 1.0e-2}
  train.weight_decay:    {type: loguniform, low: 1.0e-6, high: 1.0e-2}
  train.batch_size:      {type: categorical, choices: [64, 128, 256]}
  model.params.dropout:  {type: uniform, low: 0.0, high: 0.5}
  train.label_smoothing: {type: categorical, choices: [0.0, 0.1]}
